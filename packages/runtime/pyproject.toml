[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threemind-runtime"
version = "2.1.0"
description = "Independent plastic ThreeMind kernels, adapters, observers and model runtime"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pyarrow>=16,<60", "pydantic>=2.8,<3", "psutil>=5.9,<8"]

[project.optional-dependencies]
world = ["mujoco>=3.3,<4"]
media = ["av>=13", "Pillow>=10"]

[project.scripts]
threemind-runtime = "threemind_runtime.cli:main"
threemind-world = "threemind_runtime.world_cli:main"
threemind-robot = "threemind_runtime.robot_cli:main"
threemind-ecology = "threemind_runtime.ecology_cli:main"
threemind-observe = "threemind_runtime.ecology_observer_cli:main"
threemind-observation = "threemind_runtime.observation_cli:main"
threemind-adapters = "threemind_runtime.adapter_cli:main"
threemind-calibrate = "threemind_runtime.calibration_cli:main"
threemind-kernels = "threemind_kernels.cli:main"
threemind-deployment = "threemind_runtime.deployment:main"

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["threemind_core*", "threemind_kernels*", "threemind_runtime*"]

[tool.setuptools.package-data]
threemind_kernels = ["baselines/*.json"]
threemind_runtime = ["robot_assets.json", "playground_assets.json"]
