<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreeMind · 个体间信号实验</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5f2;color:#193e37;font:15px system-ui}main{max-width:1280px;margin:auto;padding:24px}h1{margin:6px 0 16px;font-size:27px}header small,.muted{color:#607b73}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:20px}.card{background:#fff;border:1px solid #cedfd7;border-radius:12px;padding:16px}canvas{display:block;width:100%;aspect-ratio:1;background:#e8f3f1;border-radius:6px}button,select{padding:8px 12px;border:1px solid #adc6bb;background:white;color:inherit;border-radius:6px}button{cursor:pointer}button.primary{background:#207e6e;color:white}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}input[type=range]{flex:1;min-width:120px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.dot{display:inline-block;border-radius:50%;width:9px;height:9px;margin-right:5px}.numbers{font-size:17px;line-height:1.8}#detail{white-space:pre-line;line-height:1.8}#bands{aspect-ratio:3;height:110px;background:transparent}.note{font-size:13px;line-height:1.7;border-top:1px solid #e0e9e5;padding-top:12px}h2{font-size:17px;margin:4px 0 12px}#case{max-width:100%}@media(max-width:740px){main{padding:12px}.grid{grid-template-columns:1fr}h1{font-size:23px}}
</style><main><header><small>THREEMIND / E53 / 真实记录回放</small><h1>彼此发声，彼此听见</h1></header><div class="controls"><label>实验分支 <select id="case"></select></label><label><input type="checkbox" id="links" checked>显示实际声源→接收者</label><button id="png">截图 PNG</button></div><div class="grid"><section class="card"><canvas id="world" width="800" height="800"></canvas><div class="controls"><button class="primary" id="play">播放</button><input type="range" id="seek" min="0" value="0" aria-label="回放时间"><select id="speed" aria-label="速度"><option value="1">1×</option><option value="5" selected>5×</option><option value="10">10×</option></select></div><div class="legend"><span><i class="dot" style="background:#208675"></i>turn44 来源</span><span><i class="dot" style="background:#9a6bbb"></i>turn59 来源</span><span><i class="dot" style="background:#c28332"></i>engulf15 来源</span><span>橙点：营养</span></div><p id="status" class="numbers"></p></section><aside class="card"><h2>选中个体</h2><div id="detail"></div><h2 style="margin-top:22px">实际接收的双耳频带</h2><canvas id="bands" width="600" height="170"></canvas><p class="muted">点击海洋中的个体。频带来自记录的物理信号，没有翻译为词语。</p><div class="note">保留完整海洋和全部营养物质。连线表示200毫秒记录区间内确有声音包到达，端点采用该帧位置；它不是神经连接、意图或语言的标注。静音分支仍显示到达环境的声音，耳内已屏蔽他者；频带图显示实际通过控制后的值。嘴巴目前是被动发声器，不能把画面中的声音直接称为对话。播放和显示开关均不改变原实验。</div></aside></div></main>
<script type="module">
document.querySelector('#play').disabled=true;document.querySelector('#status').textContent='正在解压完整场景记录…';
const packed=/*PACKED_RECORDINGS*/"";
if(typeof DecompressionStream==='undefined'){document.querySelector('#status').textContent='请用支持 gzip 解压的近期浏览器打开此回放。';throw new Error('Browser DecompressionStream required')}
const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
const data=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()),select=document.querySelector('#case'),seek=document.querySelector('#seek'),canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),bands=document.querySelector('#bands'),bctx=bands.getContext('2d');let index=0,chosen=0,playing=false,clock=0,last=0;
document.querySelector('#play').disabled=false;
const colors={turn44:'#208675',turn59:'#9a6bbb',engulf15:'#c28332'};
data.forEach((d,i)=>{const op=document.createElement('option');op.value=i;op.textContent=d.label||d.name;op.title=d.name;select.append(op)});
function frame(){return data[index].frames[+seek.value]}function draw(){const r=data[index],f=frame(),side=r.protocol.side_m,S=800/side;ctx.clearRect(0,0,800,800);ctx.fillStyle='#b5802b';for(const [x,y]of f.food){ctx.beginPath();ctx.arc(x*S,y*S,1.5,0,Math.PI*2);ctx.fill()}
const byid=Object.fromEntries(f.members.map(m=>[m.id,m]));if(document.querySelector('#links').checked){for(const [a,b]of f.links){const u=byid[a],v=byid[b];if(!u?.physical||!v?.physical)continue;const dx=v.position[0]-u.position[0],dy=v.position[1]-u.position[1];if(Math.abs(dx)>side/2||Math.abs(dy)>side/2)continue;ctx.strokeStyle=(a===chosen||b===chosen)?'#2b808c99':'#729ba01c';ctx.lineWidth=(a===chosen||b===chosen)?1.6:.5;ctx.beginPath();ctx.moveTo(...u.position.map(x=>x*S));ctx.lineTo(...v.position.map(x=>x*S));ctx.stroke()}}
for(const b of f.members){if(!b.physical)continue;const rad=b.radius/Math.sqrt(1+4*b.elongation/Math.PI)*S,L=b.elongation*rad;ctx.save();ctx.translate(...b.position.map(x=>x*S));ctx.rotate(b.angle);ctx.fillStyle=colors[b.cohort]||'#647780';ctx.strokeStyle=b.id===chosen?'#173c37':'#ffffff';ctx.lineWidth=b.id===chosen?2.5:1;ctx.beginPath();ctx.moveTo(-L,-rad);ctx.lineTo(L,-rad);ctx.arc(L,0,rad,-Math.PI/2,Math.PI/2);ctx.lineTo(-L,rad);ctx.arc(-L,0,rad,Math.PI/2,Math.PI*1.5);ctx.fill();ctx.stroke();ctx.restore()}
document.querySelector('#status').textContent=`${(f.time_us/1e6).toFixed(1)} 模拟秒 · ${f.members.filter(x=>x.physical).length} 个体 · ${f.food.length} 颗营养 · 累计吞食 ${f.members.reduce((n,b)=>n+b.captured,0)}`;const b=byid[chosen];document.querySelector('#detail').textContent=b?`个体 ${b.id} · ${b.cohort} 来源\n第 ${b.generation} 代 · 亲代 ${b.parent??'无'}\n${b.physical?'躯体仍在场':'躯体已失去'} · 体半径 ${(b.radius*1000).toFixed(2)} mm\n营养摄入 ${b.grains} · 吞食 ${b.captured}\n身体储备 ${b.storage.toFixed(1)}`:'该时刻尚无选中个体';bctx.clearRect(0,0,600,170);const values=f.bands[chosen]||[Array(8).fill(0),Array(8).fill(0)],max=Math.max(1,...values.flat());for(let ear=0;ear<2;ear++)for(let k=0;k<values[ear].length;k++){const h=values[ear][k]/max*120;bctx.fillStyle=ear?'#be7e42':'#228a89';bctx.fillRect(k*70+ear*26+12,140-h,22,h)}bctx.fillStyle='#526b62';bctx.font='16px system-ui';bctx.fillText('左耳 / 右耳 · 当前最高功率 '+max.toFixed(2),12,165)}
function choose(){index=+select.value;seek.max=data[index].frames.length-1;seek.value=0;clock=frame().time_us/1e6;chosen=frame().members.find(x=>x.physical)?.id??0;playing=false;document.querySelector('#play').textContent='播放';draw()}select.onchange=choose;seek.oninput=()=>{clock=frame().time_us/1e6;draw()};document.querySelector('#links').onchange=draw;document.querySelector('#play').onclick=()=>{playing=!playing;last=0;document.querySelector('#play').textContent=playing?'暂停':'播放'};canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),s=data[index].protocol.side_m,p=[(e.clientX-r.left)/r.width*s,(e.clientY-r.top)/r.height*s];const bs=frame().members.filter(b=>b.physical).sort((a,b)=>Math.hypot(a.position[0]-p[0],a.position[1]-p[1])-Math.hypot(b.position[0]-p[0],b.position[1]-p[1]));if(bs.length)chosen=bs[0].id;draw()};document.querySelector('#png').onclick=()=>{draw();canvas.toBlob(blob=>{const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=`E53-${data[index].name}-${frame().time_us}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)})};function tick(t){if(playing){if(last){clock+=(t-last)/1000*+document.querySelector('#speed').value;while(+seek.value<+seek.max&&data[index].frames[+seek.value+1].time_us/1e6<=clock)seek.value=+seek.value+1;draw();if(+seek.value===+seek.max){playing=false;document.querySelector('#play').textContent='播放'}}last=t}requestAnimationFrame(tick)}choose();requestAnimationFrame(tick);
</script></html>
