<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThreeMind · 眼手活动回放</title>
<style>body{margin:0;background:#edf4f1;color:#153f38;font:16px system-ui}main{max-width:1360px;margin:auto;padding:18px}h1{font-size:25px;margin:0 0 12px}canvas{display:block;width:100%;background:#fff;border-radius:12px}select,button{font:inherit;border:1px solid #a2beb3;background:white;color:inherit;padding:9px;border-radius:7px}#clip{width:100%;margin-bottom:12px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}#seek{flex:1;min-width:160px}small{display:block;line-height:1.6;margin-top:12px}#status{font-size:14px}@media(max-width:600px){main{padding:8px}h1{font-size:20px}.controls{gap:6px}}</style>
<main><h1 id="title"></h1><select id="clip" aria-label="选择实验和问题"></select><canvas id="view" width="1280" height="780"></canvas><div class="controls"><button id="play">播放</button><input id="seek" type="range" min="0" step="1" aria-label="逐采样回放"><select id="speed" aria-label="速度"><option>1</option><option>2</option><option>4</option><option>8</option></select><button id="shot">截图</button><button id="record">录制当前画面</button><span id="status"></span></div><small id="gaze_stats"></small><small>左侧为完整物理场景示意，右侧为实际非均匀受体的RGB采样。浅绿框是中央清晰区域投影；蓝绿色点是自身指针；紫色点是教学时实际存在的教师指示。保留每个记录帧与全部问题，不补画理想轨迹。内核统计对应本次采样推进后的状态，采样间保持原值；回放不运行内核。录制输出WebM，截图输出PNG。</small></main>
<script>
const DATA=__DATA__, $=id=>document.getElementById(id), canvas=$('view'), scene=document.createElement('canvas');scene.width=1280;scene.height=780;const ctx=scene.getContext('2d');
const colors=['#ec5353','#e5c749','#416ad6','#46a966','#a5b5b0'],names=['球体','圆柱体','立方体','圆锥体','色卡'];
let ci=0,fi=0,playing=false,last=0,elapsed=0,recorder=null,capture=null,chunks=[];
$('title').textContent=DATA.title;
const groups=new Map();DATA.clips.forEach((c,i)=>{const name=c.case_label||c.case;if(!groups.has(name)){const group=document.createElement('optgroup');group.label=name;groups.set(name,group);$('clip').append(group)}const o=document.createElement('option');o.value=i;o.textContent=`${i+1} · ${c.label}`;groups.get(name).append(o)});
function text(t,x,y,size=20,color='#214b41'){ctx.fillStyle=color;ctx.font=`${size}px "Microsoft YaHei",system-ui`;ctx.fillText(t,x,y)}
function xy(p){return[320+p[0]*228,375-p[1]*228]}
function line(points,color,width=2){if(!points.length)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke()}
function ground(f,u,v){const c=f.camera,d=c.forward.map((x,i)=>x+u*c.right[i]+v*c.up[i]),k=(.16-c.origin_m[2])/d[2];return c.origin_m.slice(0,2).map((x,i)=>x+k*d[i])}
function select(i){ci=i;fi=0;elapsed=0;$('clip').value=i;$('seek').max=DATA.clips[ci].frames.length-1;draw()}
function draw(){const c=DATA.clips[ci],f=c.frames[fi];ctx.fillStyle='#fbfdfc';ctx.fillRect(0,0,1280,780);text(f.teacher_utterance?`教师：${f.teacher_utterance}`:c.label,25,37,26);text(`${c.case_label||c.case} · 第 ${fi+1}/${c.frames.length} 帧 · ${f.t.toFixed(2)} 世界秒`,25,69,17,'#647f74');text(c.action_source||(c.case.startsWith('A-')?'装置对照：眼动由预设轨迹控制':c.case.startsWith('B-')?'教学／采集：固定或预设扫描':c.case.includes('empty')?'输出切断对照':c.case.includes('incoming')?'直接感官对照：外设绕过Core读取入射量':c.case.includes('learned')?'眼、手由两个独立监督外设读取活动控制':'手臂读取活动；视线为固定／预设扫描'),25,96,16,'#647f74');
ctx.fillStyle='#f0f7f4';ctx.fillRect(55,112,535,520);ctx.strokeStyle='#bed2ca';ctx.strokeRect(55,112,535,520);
for(let i=0;i<f.items.length;i++){const [s,col]=f.items[i],[x,y]=xy(f.positions[i]);ctx.fillStyle=colors[col];ctx.beginPath();if(s===0)ctx.arc(x,y,29,0,Math.PI*2);else if(s===3){ctx.moveTo(x,y-32);ctx.lineTo(x-28,y+25);ctx.lineTo(x+28,y+25)}else if(s===1)ctx.roundRect(x-26,y-32,52,64,14);else ctx.rect(x-29,y-29,58,58);ctx.fill();text(names[s],x-34,y+54,17)}
const retina=DATA.retinas[f.retina],half=retina.half_width;const corners=[[-half,-half],[half,-half],[half,half],[-half,half],[-half,-half]].map(v=>xy(ground(f,...v)));line(corners,'#2f967c',2);const gp=xy(ground(f,0,0));ctx.strokeStyle='#237562';ctx.beginPath();ctx.moveTo(gp[0]-8,gp[1]);ctx.lineTo(gp[0]+8,gp[1]);ctx.moveTo(gp[0],gp[1]-8);ctx.lineTo(gp[0],gp[1]+8);ctx.stroke();
line(c.frames.slice(Math.max(0,fi-60),fi+1).map(v=>xy(v.p)),'#77a89b',2);const sp=xy(f.p);ctx.fillStyle='#087d68';ctx.beginPath();ctx.arc(...sp,8,0,Math.PI*2);ctx.fill();if(f.marker){ctx.fillStyle='#bd3896';ctx.beginPath();ctx.arc(...xy(f.marker),10,0,Math.PI*2);ctx.fill()}
text('当前真实视网膜 · 中央细、外围粗',640,122,22);const l=705,t=147,size=360,a=retina.aperture;
retina.centers.forEach(([u,v],i)=>{const [w,h]=retina.widths[i],rgb=f.values.slice(i*4+1,i*4+4).map(x=>Math.round(x*255));ctx.fillStyle=`rgb(${rgb})`;const x=l+(u-w/2+a)/(2*a)*size,y=t+(a-v-h/2)/(2*a)*size;ctx.fillRect(x,y,w/(2*a)*size,h/(2*a)*size);ctx.strokeStyle='#e6efeb';ctx.lineWidth=.6;ctx.strokeRect(x,y,w/(2*a)*size,h/(2*a)*size)});
text(`世界 ${f.t.toFixed(2)} s · Core ${f.core_t==null?'原文件未记录':f.core_t.toFixed(2)+' s'}`,640,524,14,'#647f74');text(`眼位 ${f.eye.map(x=>x.toFixed(3)).join(' / ')} rad`,640,542,19);text(`鼻部参照：${f.nose?'有':'无'}`,1040,542,16);text(`激活 ${f.totals.activation.toFixed(3)} · 抑制 ${f.totals.inhibition.toFixed(3)}`,640,575,19);text(`直接触达 ${f.totals.direct.toFixed(3)} · 联想触达 ${f.totals.associative.toFixed(3)}`,640,606,19);
if(f.body_feedback){const b=f.body_feedback;text(`玩具接触 ${b.contacts} 次 · 触力 ${Math.hypot(...b.touch_N).toFixed(2)} N · 双耳 ${Math.hypot(...b.ears).toFixed(3)} · 口开度 ${b.mouth[0].toFixed(2)}`,640,630,14,'#647f74')}
const values=c.frames.map(v=>v.totals.associative),max=Math.max(.001,...values);line(values.map((v,i)=>[65+i/Math.max(1,values.length-1)*1150,724-v/max*65]),'#128872');ctx.strokeStyle='#c18f40';ctx.beginPath();const marker=65+fi/Math.max(1,values.length-1)*1150;ctx.moveTo(marker,650);ctx.lineTo(marker,728);ctx.stroke();text('本段联想触达 · 原记录；纵轴随段落标度，仅用于显示',65,755,16,'#647f74');
if(c.result&&c.result.target_distance!==undefined&&fi===c.frames.length-1)text(`最近对象 ${c.result.correct?'正确':'错误'} · 目标距离 ${c.result.target_distance.toFixed(3)} m`,640,643,18,c.result.correct?'#0f705a':'#a35440');
if(c.result&&c.result.eye_stable_fraction!==undefined&&fi===c.frames.length-1)text(`稳定注视 ${(100*c.result.eye_stable_fraction).toFixed(1)}% · 手部到达 ${(100*c.result.hand_arrived_fraction).toFixed(1)}%`,640,643,18);
if(c.result&&c.result.eye_end_error_rad!==undefined&&fi===c.frames.length-1)text(`眼误差 ${c.result.eye_end_error_rad.toFixed(3)} rad · 手误差 ${c.result.hand_end_error_m.toFixed(3)} m · ${c.result.end_reached?'末时到达':'末时未到达'}`,640,660,16,c.result.end_reached?'#0f705a':'#a35440');
if(f.expression){const e=f.expression;const p=e.probabilities;const confidence=p?Math.max(...p):0;text(`${e.readout_profile==='whole-question'?'正式回答（整段提问）':'当前逐窗表达'}：${e.word||'无活动输出'} · ${(confidence*100).toFixed(1)}%`,640,632,20);if(c.result&&typeof c.result.correct==='boolean'&&fi===c.frames.length-1)text(`本题：${c.result.correct?'正确':'错误'} · 教师期望仅用于评分`,640,655,16,c.result.correct?'#0f705a':'#a35440')}
const narrow=innerWidth<680;const width=narrow?640:1280,height=narrow?1370:780;if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height}const display=canvas.getContext('2d');display.fillStyle='#fbfdfc';display.fillRect(0,0,width,height);if(narrow){display.drawImage(scene,0,0,635,635,0,0,635,635);display.drawImage(scene,630,103,610,580,15,650,610,580);display.drawImage(scene,55,650,1170,95,25,1250,590,55);display.fillStyle='#647f74';display.font='18px system-ui';display.fillText('联想触达曲线 · 完整记录',25,1340)}else display.drawImage(scene,0,0);
const phases=c.gaze_events?.phases||[],phase=phases.find(p=>fi*c.sample_interval_s>=p.start_s&&fi*c.sample_interval_s<p.start_s+p.duration_s)||phases.at(-1);$('gaze_stats').textContent=phase?`本目标阶段完整记录统计：首次进入清晰区 ${phase.clear_center.first_s===null?'未进入':phase.clear_center.first_s.toFixed(2)+' 秒'}${phase.clear_center.inside_at_start?'（阶段起点已经对准）':''}；清晰区连续停留最长 ${phase.clear_center.longest_s.toFixed(2)} 秒；低速且对准最长 ${phase.aligned_slow.longest_s.toFixed(2)} 秒。` : '';
$('seek').value=fi;$('status').textContent=`${f.t.toFixed(2)} 世界秒${recorder?' · 录制中':''}`;if(capture)capture.getVideoTracks()[0].requestFrame();}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('clip').onchange=e=>select(Number(e.target.value));$('seek').oninput=e=>{fi=Number(e.target.value);draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};
$('shot').onclick=()=>canvas.toBlob(b=>download(b,'threemind-active-vision.png'));
$('record').onclick=()=>{if(recorder){if(recorder.state==='recording')recorder.stop();return}if(!canvas.captureStream||!window.MediaRecorder){$('status').textContent='当前浏览器不支持画面录制';return}chunks=[];capture=canvas.captureStream(0);const mime='video/webm;codecs=vp8';recorder=new MediaRecorder(capture,MediaRecorder.isTypeSupported(mime)?{mimeType:mime}:{});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onerror=e=>{$('status').textContent=`录制失败：${e.error?.message||'编码器错误'}`};recorder.onstop=()=>{const output=new Blob(chunks,{type:recorder.mimeType});capture.getTracks().forEach(t=>t.stop());capture=null;recorder=null;$('record').textContent='录制当前画面';draw();if(output.size>1024)download(output,'threemind-active-vision.webm');else $('status').textContent='录制未产生有效画面，请重试或使用支持WebM的浏览器'};recorder.start(100);$('record').textContent='结束并保存';playing=true;$('play').textContent='暂停';draw()};
function step(now){if(last&&playing){elapsed+=(now-last)/1000*Number($('speed').value);while(elapsed>=DATA.clips[ci].sample_interval_s){elapsed-=DATA.clips[ci].sample_interval_s;fi++;if(fi>=DATA.clips[ci].frames.length){if(ci+1<DATA.clips.length)select(ci+1);else{fi=DATA.clips[ci].frames.length-1;playing=false;$('play').textContent='播放';if(recorder)recorder.stop();break}}}draw()}last=now;requestAnimationFrame(step)}select(0);requestAnimationFrame(step);
window.replay={seek:(chapter,frame)=>{select(chapter);fi=Math.max(0,Math.min(frame,DATA.clips[ci].frames.length-1));draw()},clips:DATA.clips.length};
window.addEventListener('resize',draw);
</script></html>
