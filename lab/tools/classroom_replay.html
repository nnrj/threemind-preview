<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThreeMind · 完整课堂核查</title>
<style>body{margin:0;background:#ecf3f0;color:#173f3a;font:16px system-ui}main{max-width:1500px;margin:auto;padding:16px}h1{font-size:24px;margin:4px 0 10px}canvas{width:100%;height:auto;background:#f6faf8;border-radius:10px}select,button{font:inherit;color:inherit;background:white;border:1px solid #97b6ac;border-radius:6px;padding:9px}select{width:100%;margin-bottom:10px}input{width:100%}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}small{display:block;margin-top:10px;line-height:1.6}@media(max-width:650px){main{padding:8px}h1{font-size:20px}}</style>
<main><h1>E55 · 完整教学、问答与实际指向</h1><select id="chapter" aria-label="选择实验组"></select><canvas id="view" width="1600" height="900"></canvas><input id="seek" type="range" min="0" step=".05" aria-label="影片进度"><div class="controls"><button id="play">播放</button><button id="shot">截图</button><span id="time"></span></div><small>仅回放已存数据，不运行意识或重算答案。教学与校准4倍速，等待8倍速，正式检验1倍速；采样间保持原值。运动检验的橙色目标环只作评分；问答另保留真实教师指向。每道问答和动作检验从同源快照的独立副本开始。完整原始数据仍以证据包为准。</small></main>
<script>
const DATA=__DATA__,canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const W=1600,H=900,positions=[[-.55,-.55],[.55,-.55],[-.55,.55],[.55,.55]],names=['球体','圆柱体','立方体','圆锥体','色卡'],colours=['#ec5252','#eac743','#4b81d5','#43a57b','#a6b8b1'],labels=[...names.slice(0,4),'红色','黄色','蓝色','绿色'];
let time=0,playing=false,last=0;const flat=[];
for(let ci=0;ci<DATA.chapters.length;ci++){const ch=DATA.chapters[ci];for(let i=0;i<ch.clips.length;i++){const c=ch.clips[i];c.ch=ci;c.ordinal=i;flat.push(c);}const o=document.createElement('option');o.value=ch.start;o.textContent=String(ci+1).padStart(2,'0')+' · '+ch.title+'（'+ch.trials+'项）';$('chapter').append(o);}
$('seek').max=DATA.duration;
function text(s,x,y,size=24,colour='#1e453e',bold=false){ctx.fillStyle=colour;ctx.font=`${bold?'600 ':''}${size}px "Microsoft YaHei",system-ui`;ctx.textAlign='left';ctx.fillText(s,x,y)}
function wrap(s,x,y,width,size=24,colour='#1e453e'){ctx.font=`${size}px "Microsoft YaHei",system-ui`;let line='',yy=y;for(const c of s){if(ctx.measureText(line+c).width>width){text(line,x,yy,size,colour);line='';yy+=size*1.5;}line+=c;}text(line,x,yy,size,colour);return yy;}
function box(x,y,w,h,fill='#fff'){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,16);ctx.fill()}
function clock(t){return Math.floor(t/60).toString().padStart(2,'0')+':'+Math.floor(t%60).toString().padStart(2,'0')}
function xy(p){return[402+p[0]*285,452-p[1]*252]}
function distance(p,target){return Math.hypot(p[0]-target[0],p[1]-target[1])}
function header(title,sub){ctx.fillStyle='#edf4f1';ctx.fillRect(0,0,W,H);text('THREEMIND / E55 / 已记录的实验过程',40,36,19,'#55756d');text(title,40,82,33,'#113c36',true);text(sub,40,116,21,'#527369')}
function chart(values,x,y,w,h,limit,current,threshold){ctx.strokeStyle='#cfdfd8';ctx.strokeRect(x,y,w,h);let max=Math.max(limit,...values,1e-6);if(threshold!==undefined){const yy=y+h-h*threshold/max;ctx.strokeStyle='#55ad88';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke();ctx.setLineDash([])}ctx.strokeStyle='#227f71';ctx.lineWidth=2;ctx.beginPath();values.slice(0,current+1).forEach((v,i)=>{const px=x+(values.length>1?i/(values.length-1):0)*w,py=y+h-h*v/max;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.lineWidth=1;}
function findClip(t){let lo=0,hi=flat.length-1;while(lo<=hi){const m=(lo+hi)>>1;if(flat[m].start<=t)lo=m+1;else hi=m-1;}return hi>=0&&t<flat[hi].start+flat[hi].duration?flat[hi]:null;}
function draw(t){time=Math.min(Math.max(t,0),DATA.duration);const c=findClip(time);
if(time<DATA.intro){header('完整课堂：从教学到各组真实回答','全部已完成组；保留答对、答错、偏离与到达');box(40,155,1520,670);text('本片包括',80,213,29,'#173e36',true);const lines=['正常学习、关闭Core可塑学习：各168课与间隔、各96项外设校准。','全部严格问答、新组合、新排列；已有连接静默48题与恢复8题。','全部180段教师引导动作，以及三种运动表达器各32次自主指向。','教学 / 校准 4倍速 · 复习间隔 8倍速 · 正式检验 1倍速，结果停留。','每次正式检验来自同一来源快照的独立副本，并非一条连续人生。','离线拟合与汇总没有物理轨迹：只列实测结果，不补造训练动画。','运动中的橙环和距离只作评分；问答保留原有的真实教师指向输入。'];lines.forEach((s,i)=>text(s,80,274+i*66,25));text('可按章节核查；没有省略失败试次。',80,770,26,'#186d5c',true);}
else if(!c){const ch=DATA.chapters.find(ch=>time>=ch.start&&time<ch.end);if(ch){header('实验组 '+String(DATA.chapters.indexOf(ch)+1).padStart(2,'0'),ch.title);box(40,165,1520,650);wrap(ch.title,90,240,1400,36);text('完整记录 '+ch.trials+' 项 · 来源 '+ch.case,90,315,23);const notes=ch.kind==='motor'?['三组使用同一1200秒来源和相同32题。','撤掉教师施力；表达器只读取意识原始活动过程。','每题1秒文字请求＋2秒真实动作；可看是否先靠近、后偏离。']:ch.kind==='motor-teaching'?['从正常课堂的516秒快照继续学习。','外部教师在示范中施力；本章到达不计作自主成功。','十二种已教组合：各12次连续示范，随后3轮逐项复习。']:ch.kind==='calibration'?['这些是训练外设的校准观察，不算正式考试。','标签只用于外设训练，正式检验时不会交给表达器。','两个来源各自训练相同的小型Transformer。']:ch.kind==='question'?['各题独立恢复同一来源；场景完整保留，只按题目改变指向/问题。','最终回答到完整窗口结束才显示；画面不重新解码。','正确答案只用于事后评分，所有错误原样保留。']:['从空白来源开始，持续感受身体与环境变化。','每概念先连续12次，再先密后疏复习；每概念共21次。','示范是教师话语，不是意识自己的回答。'];notes.forEach((s,i)=>text(s,90,410+75*i,27));}
else{header('完整实验回放结束','目前部分辨认可读，但稳定形色组合与按话指向尚未达成');box(40,160,1520,660);const ls=['严格形色：正常29/48；关闭Core学习26/48；原连接静默27/48。','未教过的组合：正常6/16，其中形状0/8、颜色6/8。','实际到达：最近4帧1/32；完整过程0/32；整段选模1/32。','最近4帧：0.25秒时23/32更近；2秒时17/32更近；最终到达1/32。','因此有早期靠近现象，但还不能把它判作可靠的目标控制。','未执行：等间隔课程、第二来源、后三组完整运动干预与恢复。','下一步建议：分开检查选物是否正确、运动执行能否稳定到位。'];ls.forEach((s,i)=>text(s,78,238+i*74,27));}}
else{const ch=DATA.chapters[c.ch],q=c.trial,frames=c.frames,fi=Math.min(frames.length-1,Math.floor((time-c.start)*c.speed/.05)),f=frames[fi];const complete=time>=c.start+frames.length*.05/c.speed;
header(ch.title,`${c.mode==='interval'?'复习间隔':(q.ordinal?'第 '+q.ordinal+' 课':'第 '+(ch.clips.filter(x=>x.mode!=='interval').indexOf(c)+1)+' / '+ch.trials+' 项')} · ${c.speed}× · 实际模拟时间 ${f.t.toFixed(2)} 秒`);
box(35,144,735,664);box(790,144,775,664);ctx.fillStyle='#f0f7f3';ctx.fillRect(102,199,600,506);ctx.strokeStyle='#c4d9ce';ctx.strokeRect(117,200,570,504);
const slot=q.requested_slot??q.slot,goal=slot!==undefined?positions[slot]:null;
f.items.forEach((v,i)=>{const[x,y]=xy(positions[i]);ctx.fillStyle=colours[v[1]];ctx.beginPath();if(v[0]===0)ctx.arc(x,y,33,0,7);else if(v[0]===3){ctx.moveTo(x,y-36);ctx.lineTo(x-33,y+29);ctx.lineTo(x+33,y+29);ctx.closePath()}else if(v[0]===1)ctx.roundRect(x-25,y-35,50,70,12);else ctx.rect(x-32,y-29,64,v[0]===4?14:58);ctx.fill();text(names[v[0]],x-37,y+64,22);});
if(goal){const[x,y]=xy(goal);ctx.strokeStyle='#d39138';ctx.lineWidth=3;ctx.setLineDash([8,5]);ctx.beginPath();ctx.ellipse(x,y,.15*285,.15*252,0,0,7);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;}
if(f.marker){const[x,y]=xy(f.marker);ctx.strokeStyle='#b77a36';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.stroke();ctx.setLineDash([]);}
ctx.strokeStyle='#719e8f';ctx.lineWidth=2;ctx.beginPath();frames.slice(0,fi+1).forEach((r,i)=>{const p=xy(r.p);i?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.stroke();ctx.lineWidth=1;const[x,y]=xy(f.p);ctx.fillStyle='#087564';ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.fill();text('自身指针',Math.min(x+13,620),y-15,21);
text('场景示意 · 轨迹来自记录',65,763,20,'#56766b');text(c.mode==='motor'?'橙环仅评分，不进运动输入':'外环评分 · 内环教师标记',390,763,20,'#9b6c24');
let yy=wrap(q.text||'持续环境输入',820,194,710,28,'#173f38');
if(c.mode==='question'){text(complete?'实际回答：'+q.answer:'观察中，等待窗口结束',820,yy+51,30,complete?'#147665':'#698279',true);text(complete?(q.correct?'回答正确':'回答错误；评分答案：'+labels[q.target]):'保留原始活动，未重新调用表达器',820,yy+92,23,q.correct?'#258568':'#ad7246');}
else if(c.mode==='calibration'){text('外设校准标签：'+q.teacher_label,820,yy+51,28);text('仅训练监督，不计作独立测试回答',820,yy+91,23,'#698279');}
else if(c.mode==='motor'){text(complete?(q.reached?'最终到达请求对象':q.choice_correct?'最近对象正确，但未到达':'未指出请求对象'):'自主动作检验 · 教师没有施力',820,yy+51,28,'#147665',true);text(complete?'最终误差 '+q.error.toFixed(3)+' 米 · '+(q.entered_target?'途中进入过目标':'途中未进入目标'):'保留当前位置与每一步动作，不补画理想轨迹',820,yy+91,23);}
else{text(c.mode==='motor-teaching'?'教师正在施力示范（不计自主成功）':c.mode==='interval'?'没有新教学语句；感官仍持续采样':'教师教学，不是意识回答',820,yy+51,26,'#777259');text(q.presentation?'同项第 '+q.presentation+' 次 · '+q.phase:'每条记录均保留',820,yy+91,21,'#698279');}
text('实际低分辨率视觉输入',820,373,23);for(let s=0;s<4;s++)for(let j=0;j<16;j++){const rgb=f.rgb.slice((s*16+j)*3,(s*16+j)*3+3);ctx.fillStyle=`rgb(${rgb})`;ctx.fillRect(825+s*177+j%4*31,393+Math.floor(j/4)*31,29,29)}
text('激活 '+f.a.toFixed(3)+'   抑制 '+f.i.toFixed(3)+'   联想触达 '+f.r.toFixed(3),820,558,22);
if((c.mode==='motor'||c.mode==='motor-teaching')&&goal){const actionIndex=frames.findIndex(v=>v.force),initial=distance(frames[Math.max(0,actionIndex)].before,goal),d=distance(f.p,goal),change=initial-d;const vals=frames.map(v=>distance(v.p,goal));text('距目标 '+d.toFixed(3)+' 米 · 相对动作起点'+(change>=0?'靠近 ':'远离 ')+Math.abs(change).toFixed(3)+' 米',820,600,24);chart(vals,824,621,690,106,2,fi,.15);text('距离随时间变化 ↓ 越低越近；虚线＝0.15米范围',820,761,21,'#54776a');}
else{chart(frames.map(v=>v.a),824,618,690,100,0,fi);text('全网激活过程 · 只显示已记录值',820,760,21,'#54776a');}
const b=f.body;text(`环境持续存在 · 风 ${b.wind_x_m_s.toFixed(2)}, ${b.wind_y_m_s.toFixed(2)} m/s · 温度 ${b.air_temperature_K.toFixed(1)} K · 重力支撑 ${b.support_force_N.toFixed(2)} N`,42,846,21,'#5b756b');
}
text(clock(time)+' / '+clock(DATA.duration)+'  ·  实录数据回放，不运行Core',40,883,18,'#5b766c');$('time').textContent=clock(time)+' / '+clock(DATA.duration);$('seek').value=time;
}
window.classroomReplay={duration:DATA.duration,chapters:DATA.chapters.map(c=>({title:c.title,start:c.start,end:c.end})),draw,frame(t,type='image/jpeg'){draw(t);return canvas.toDataURL(type,.91).split(',')[1]}};
$('chapter').onchange=()=>{playing=false;$('play').textContent='播放';draw(+$('chapter').value)};$('seek').oninput=()=>draw(+$('seek').value);$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';last=0};$('shot').onclick=()=>{const a=document.createElement('a');a.download='ThreeMind-E55-complete.png';a.href=canvas.toDataURL();a.click()};function loop(t){if(playing){if(last)draw(time+(t-last)/1000);last=t;if(time>=DATA.duration){playing=false;$('play').textContent='播放'}}requestAnimationFrame(loop)}draw(0);requestAnimationFrame(loop);
</script></html>
