<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThreeMind · 形色课堂</title>
<style>body{background:#edf3f1;color:#203e38;font:16px system-ui;margin:0}main{max-width:1150px;margin:auto;padding:20px}h1{margin:8px 0}small{color:#58756f}section{background:white;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}canvas{width:100%;background:#f7faf9;border:1px solid #dde9e5;border-radius:8px}button,select{background:#fff;border:1px solid #97b6ac;border-radius:6px;padding:9px;color:inherit;font:inherit}select{width:100%}button{cursor:pointer}input[type=range]{width:100%}p{line-height:1.65}.answer{font-size:24px;font-weight:600;color:#19786a}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:200px;overflow:auto}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}h1{font-size:24px}}</style>
<style>.grid>section{min-width:0}canvas,select{box-sizing:border-box;max-width:100%}</style>
<main><small>THREEMIND / E54 / 已记录的教学与检验</small><h1>形状、颜色与指向</h1><p>画面按实际记录回放；不重新运行意识。教师标记用虚线圆，自身指针用实心点。物体图标表示真实布置，像素格显示实际低分辨率RGB输入。右侧答案与评分属于整段检验的最终结果，不是当前播放帧刚刚产生的回答。</p>
<select id="clips" aria-label="选择记录"></select><div class="grid"><section><canvas id="scene" width="650" height="520"></canvas><input id="seek" type="range" min="0" value="0" aria-label="模拟时间"><button id="play">播放</button> <button id="shot">场景截图</button> <span id="time"></span></section><section><h2>问题与实际结果</h2><p id="question"></p><div class="answer" id="answer"></div><p id="score"></p><h3>实际感官画面</h3><canvas id="senses" width="380" height="180"></canvas><p id="activity"></p><details><summary>原始评分与来源</summary><pre id="raw"></pre><p id="source"></p></details></section></div><small>配色和图标属于观察界面。坐标、动作、采样和回答来自证据；目标答案只用于评分，没有通过回放送回Core。运动成功不单独证明动作动机。</small></main>
<script>const DATA=__DATA__;const $=x=>document.getElementById(x),ctx=$('scene').getContext('2d'),vis=$('senses').getContext('2d');let index=0,pos=0,playing=false,prev=0;const names=['球体','圆柱体','立方体','圆锥体','色卡'],colors=['#ef4949','#e8ca31','#477ddc','#3daa75','#aaa'],positions=[[-.55,-.55],[.55,-.55],[-.55,.55],[.55,.55]];
DATA.clips.forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=c.title;$('clips').append(o)});
function xy(p){return[325+p[0]*225,260-p[1]*200]}function draw(){const c=DATA.clips[index],f=c.frames[pos],o=f.observation;ctx.clearRect(0,0,650,520);ctx.fillStyle='#f1f7f5';ctx.fillRect(40,30,570,460);ctx.strokeStyle='#c7dcd3';ctx.strokeRect(100,60,450,400);
if(!o.motor_only)o.items.forEach((v,i)=>{const[x,y]=xy(positions[i]);ctx.fillStyle=colors[v[1]];ctx.beginPath();if(v[0]===0){ctx.arc(x,y,32,0,7)}else if(v[0]===3){ctx.moveTo(x,y-36);ctx.lineTo(x-32,y+27);ctx.lineTo(x+32,y+27);ctx.closePath()}else if(v[0]===1){ctx.roundRect(x-24,y-34,48,64,12)}else{ctx.rect(x-30,y-28,60,v[0]===4?12:56)}ctx.fill();ctx.fillStyle='#304f47';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillText(names[v[0]],x,y+53)});
if(o.teacher_limb){const t=xy([o.teacher_limb.x,o.teacher_limb.y]);ctx.strokeStyle='#ce7c30';ctx.lineWidth=3;ctx.beginPath();ctx.arc(...t,11,0,7);ctx.stroke();ctx.lineWidth=1;ctx.fillStyle='#865521';ctx.font='15px system-ui';ctx.textAlign='left';ctx.fillText('教师指针',t[0]+15,t[1]+20)}
ctx.strokeStyle='#8aa89f';ctx.beginPath();c.frames.slice(0,pos+1).forEach((r,i)=>{const p=xy([r.observation.pointer.x,r.observation.pointer.y]);i?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.stroke();
if(o.teacher_marker){const p=xy(o.teacher_marker);ctx.strokeStyle='#e28532';ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(...p,24,0,7);ctx.stroke();ctx.setLineDash([])}const p=xy([o.pointer.x,o.pointer.y]);ctx.fillStyle='#0c7869';ctx.beginPath();ctx.arc(...p,8,0,7);ctx.fill();ctx.fillStyle='#284b42';ctx.font='16px system-ui';ctx.textAlign='left';ctx.fillText('自身指针',p[0]+13,p[1]-8);
vis.clearRect(0,0,380,180);if(!o.motor_only)for(let slot=0;slot<4;slot++)for(let pixel=0;pixel<16;pixel++){const j=(slot*16+pixel)*4, rgb=o.values.slice(j+1,j+4).map(x=>Math.round(x*255));vis.fillStyle=`rgb(${rgb.join(',')})`;vis.fillRect(7+slot*94+pixel%4*20,28+Math.floor(pixel/4)*20,19,19)}
$('time').textContent=f.time.toFixed(2)+' 模拟秒';$('question').textContent=c.trial.text||c.title;$('answer').textContent=c.trial.answer||('reached'in c.trial?(c.trial.reached?'到达目标':'未到达目标'):('success'in c.trial?(c.trial.success?'到达目标':'未到达目标'):'无语言输出'));
$('score').textContent='correct'in c.trial?(c.trial.correct?'本题回答正确':'本题回答错误'):('error'in c.trial?'末端误差：'+c.trial.error.toFixed(3)+' 米':'');$('activity').textContent=`记录帧全网激活 ${f.activation.toFixed(3)} · 联想触达 ${f.association.toFixed(3)} · 抑制 ${f.inhibition.toFixed(3)}`;if('directional' in c.trial){$('answer').textContent=c.trial.directional?'方向跟随':'方向未匹配';$('score').textContent='方向余弦 '+c.trial.cosine.toFixed(3)+' · 位移 '+c.trial.displacement.toFixed(3)+' 米'}
$('raw').textContent=JSON.stringify(c.trial,null,2);$('source').textContent=c.evidence;$('seek').value=pos;}
function choose(){index=+$('clips').value;pos=0;playing=false;$('play').textContent='播放';$('seek').max=DATA.clips[index].frames.length-1;draw()}$('clips').onchange=choose;$('seek').oninput=()=>{pos=+$('seek').value;draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('shot').onclick=()=>{const a=document.createElement('a');a.download='ThreeMind-E54.png';a.href=$('scene').toDataURL();a.click()};function loop(t){if(playing&&t-prev>70){pos=Math.min(pos+1,DATA.clips[index].frames.length-1);prev=t;draw();if(pos==DATA.clips[index].frames.length-1){playing=false;$('play').textContent='播放'}}requestAnimationFrame(loop)}choose();requestAnimationFrame(loop);</script></html>
