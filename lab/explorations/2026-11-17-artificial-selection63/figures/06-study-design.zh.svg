   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="470.2" y="41.716969" transform="rotate(-0 470.2 41.716969)">AS63-01：先测亲代，再检验后代</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #465665" x="470.2" y="71.192453" transform="rotate(-0 470.2 71.192453)">16个独立群体 · 每群体4名G0候选 · G0→G1→G2 · 主实验区域布局固定</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(129.343211 137.291198)">每代4名候选原体</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(121.966422 152.640648)">各连续培养60内部秒</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(127.42 168.0257)">保存完整当前状态</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(430.273211 137.305003)">选择评估：2个起点</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(409.75 152.631203)">从完整状态复制，不调用出生</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(420.973211 168.016981)">计算平均区域1停留比例</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(731.203211 137.27812)">保留测试：另4个起点</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(733.93 152.653727)">从同一完整状态复制</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(733.93 167.993731)">成绩不用于选择亲代</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(120.043211 296.901198)">每条件选2名候选原体</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(98.716422 312.28625)">区域0：最低分；区域1：最高分</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(127.42 327.571763)">随机：不读取成绩</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(738.58 296.906284)">比较各代全部候选</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(735.853211 312.272445)">每名先平均4个起点</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(731.203211 327.617536)">再平均群体内4名候选</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(120.043211 456.524276)">每名亲代产生2名子代</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(120.043211 471.882445)">每条件4名组成下一代</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(102.039719 486.537302)">threemind.birth/2 · preserve</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(411.673211 456.525003)">每个子代配1名空白内核对照</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(428.35 471.869367)">不继承亲代内核状态</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(423.7 487.218091)">外设、起点及培养相同</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(738.58 456.511198)">分别检验四个问题</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(734.708148 471.838125)">倾向保留 · 选择收益</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(734.708148 487.241341)">逐代增强 · 继承收益</text>
   </g>
