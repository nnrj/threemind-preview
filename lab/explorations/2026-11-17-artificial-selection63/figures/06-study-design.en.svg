   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="470.2" y="41.318199" transform="rotate(-0 470.2 41.318199)">AS63-01: Assess the parent, then test the descendants</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #465665" x="470.2" y="70.864123" transform="rotate(-0 470.2 70.864123)">16 independent populations · 4 G0 candidates each · G0 → G1 → G2 · Fixed primary layout</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(83.886555 136.574081)">4 original candidates per generation</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(84.818734 152.013625)">60 internal seconds of development</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(102.660203 167.317302)">Save complete current state</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(404.230305 137.698073)">Selection assessment: 2 starts</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(399.719078 151.959133)">Complete-state copies; no birth</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(412.727453 167.249005)">Mean region 1 occupancy</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(696.7765 137.698073)">Held-out assessment: 4 other starts</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(698.794164 152.013625)">Copies of the same complete state</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(706.77618 168.468903)">Scores excluded from selection</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(84.808562 296.184081)">Select 2 original candidates per arm</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(88.153656 311.54225)">Region 0: lowest; region 1: highest</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(93.793234 326.981794)">Random: independent of scores</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(675.909625 296.184081)">Compare every candidate in each generation</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(699.496023 311.54225)">Average 4 starts within candidates</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(692.385156 326.927302)">Then 4 candidates within populations</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(96.214141 455.848573)">2 offspring per selected parent</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(70.931945 471.206742)">4 offspring per arm in the next generation</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(102.039719 486.537302)">threemind.birth/2 · preserve</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(393.074664 455.848573)">1 uninherited control per offspring</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(394.410812 471.179133)">Blank Core; no parental Core state</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(385.073031 486.537302)">Same peripherals, starts, development</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(722.440867 455.77955)">Four separate questions</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(705.443664 471.15225)">Retention · Selection advantage</text>
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(699.331094 487.688903)">Accumulation · Inheritance benefit</text>
   </g>
